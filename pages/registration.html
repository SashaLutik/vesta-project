<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/components.css" />
    <link rel="stylesheet" href="../styles/pages/auth.css" />
    <title>VESTA — Регистрация</title>
  </head>
  <body>
    <header class="header">
      <div class="header-top header-top--auth">
        <div class="container header-container">
          <a href="../index.html"
            ><img src="../assets/images/icons/brand-logo.svg" alt="logo" />
          </a>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <form class="form-auth" action="" aria-labelledby="auth-reg__title">
          <h3 class="form-auth__title" id="auth-reg__title">Регистрация</h3>
          <label class="field" for="auth-name">
            <span class="field__label form-label">ФИО</span>
            <input
              type="text"
              class="form-input"
              name="name"
              id="auth-name"
              placeholder="Введите ваши ФИО"
              required
              minlength="3"
              autocomplete="name"
            />
            <small class="field__error">Укажите ФИО</small>
          </label>
          <label class="field" for="auth-login">
            <span class="field__label form-label">Логин</span>
            <input
              type="text"
              class="form-input"
              name="login"
              id="auth-login"
              placeholder="Введите ваш логин"
              required
              minlength="2"
            />
            <small class="field__error"
              >Укажите логин (минимум 2 символа)</small
            >
          </label>
          <label class="field" for="auth-email">
            <span class="field__label form-label">Email</span>
            <input
              type="email"
              class="form-input"
              name="email"
              id="auth-email"
              placeholder="example@mail.com"
              required
              autocomplete="email"
            />
            <small class="field__error">Введите корректный email</small>
          </label>
          <label class="field" for="auth-password">
            <span class="field__label form-label">Пароль</span>
            <span class="auth-password__container form-input">
              <input
                type="password"
                class="auth-password__input"
                name="password"
                id="auth-password"
                placeholder="Введите ваш пароль"
                required
                minlength="8"
              />
              <img
                src="../assets/images/icons/eye_hidden-icon.svg"
                alt="hidden eye"
                class="auth-password__icon"
                width="22"
                height="22"
              />
            </span>
            <small class="field__error">Пароль — не менее 8 символов</small>
          </label>
          <label class="field" for="auth-password-repeat">
            <span class="field__label form-label">Повтор пароля</span>
            <span class="auth-password__container form-input">
              <input
                type="password"
                class="auth-password__input"
                name="password-repeat"
                id="auth-password-repeat"
                placeholder="Повторите ваш пароль"
                required
                minlength="8"
              />
              <img
                src="../assets/images/icons/eye_hidden-icon.svg"
                alt="hidden eye"
                class="auth-password__icon"
                width="22"
                height="22"
              />
            </span>
            <small class="field__error">Пароли не совпадают</small>
          </label>

          <button type="submit" class="button button--theme_dark">
            Зарегистрироваться
          </button>

          <div class="form-auth__footer">
            <a href="login.html">Уже есть аккаунт? <span>Войти</span></a>
          </div>
        </form>
      </div>
    </main>

    <script src="../scripts/auth.js"></script>
  </body>
</html>
